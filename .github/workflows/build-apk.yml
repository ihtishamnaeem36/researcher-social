name: Build Folerio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Android SDK Platform & Accept Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Prepare Web Assets & Sync to Android
        run: |
          mkdir -p www
          npm run copy-assets
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK
        run: |
          cd android
          if ! ./gradlew assembleRelease --stacktrace > ../gradle-build.log 2>&1; then
            if ! ./gradlew assembleDebug --stacktrace >> ../gradle-build.log 2>&1; then
              ERR=$(grep -A 8 -B 1 "Execution failed for task" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              if [ -z "$ERR" ]; then
                ERR=$(grep -A 8 "What went wrong" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              fi
              if [ -z "$ERR" ]; then
                ERR=$(grep -A 5 "Caused by:" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              fi
              echo "::error title=GradleFailure::$ERR"
              tail -n 60 ../gradle-build.log
              exit 1
            fi
          fi

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -type f -name "*release*.apk" -exec cp -v {} output/Folerio.apk \; || true
          if [ ! -f output/Folerio.apk ]; then
            find android/app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} output/Folerio.apk \;
          fi
          if [ ! -f output/Folerio.apk ]; then
            echo "ERROR: Folerio.apk was not generated!"
            find android -name "*.apk"
            exit 1
          fi
          ls -lh output/Folerio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folerio-Android-APK
          path: output/Folerio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.1
          name: "Folerio Android v1.5.1 (Unified Prismatic Logo, Comment Auto-Copy, Mobile Modals & Direct Paper Links)"
          body: |
            ### Folerio Standalone Android APK (v1.5.1)
            - **Unified Proprietary Folerio Prismatic Logo:** Completely removed the old folded paper "doc-style" logo inside the app. Replaced it inside (sidebar brand, mobile topbar, authentication emblem) and outside (Android app launcher icon & cosmic canvas background) with Folerio's bespoke, clean Prismatic Crest.
            - **Intelligent Comment Draft & Auto-Copy:**
              - If an unauthenticated user submits a critique, their text is automatically copied to the device clipboard, saved to draft session storage, and the sign-in modal is cleanly presented.
              - Upon signing in, their drafted critique is automatically restored into the discussion sheet, ready to post with one tap.
              - If a network error or offline condition occurs, the critique is immediately copied to the clipboard and cached locally so no intellectual work is ever lost.
            - **Edge-to-Edge Responsive Phone Modals:**
              - Completely redesigned the Login & Create Account Modal (`#authModal`) and Share & Export Modal (`#shareModal`) for mobile screens.
              - Constrained widths to `calc(100vw - 20px)`, adjusted typography, scaled button sizes, and eliminated horizontal overflow or border clipping.
            - **Direct, Accessible Academic Paper Links:**
              - Resolved external link opening in Android WebView: primary sources and DOIs now cleanly launch in the user's default system browser via Android Intent and Capacitor Browser integration.
              - Upgraded all insecure `http://arxiv.org` and `http://doi.org` URLs to secure `https://` protocols with automatic DOI prefix expansion.
              - Replaced raw truncated link text with a clean, dedicated "Read Full Paper ↗" action button on every research slide.
            - **Complete Life Sciences Foundational Curriculum (Modules 3.1 - 3.7):** All 8 biological masterclasses covering Abiogenesis, Evolution, Cell Bioenergetics, Genetics & CRISPR, Microbiology, Physiology & Feedback Loops, Ecology & Trophic Dynamics, and Developmental Pluripotency.
            - **Universal Disciplines Expansion (53 Foundational Primers):** Complete first-principles coverage across all 22 disciplines in human knowledge.
            - **Direct Download:** Download `Folerio.apk` below and tap Install/Update.
          files: output/Folerio.apk
