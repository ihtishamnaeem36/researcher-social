name: Build Folerio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Android SDK Platform & Accept Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Prepare Web Assets & Sync to Android
        run: |
          mkdir -p www
          npm run copy-assets
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK
        run: |
          cd android
          if ! ./gradlew assembleRelease --stacktrace > ../gradle-build.log 2>&1; then
            if ! ./gradlew assembleDebug --stacktrace >> ../gradle-build.log 2>&1; then
              ERR=$(grep -A 8 -B 1 "Execution failed for task" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              if [ -z "$ERR" ]; then
                ERR=$(grep -A 8 "What went wrong" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              fi
              if [ -z "$ERR" ]; then
                ERR=$(grep -A 5 "Caused by:" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              fi
              echo "::error title=GradleFailure::$ERR"
              tail -n 60 ../gradle-build.log
              exit 1
            fi
          fi

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -type f -name "*release*.apk" -exec cp -v {} output/Folerio.apk \; || true
          if [ ! -f output/Folerio.apk ]; then
            find android/app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} output/Folerio.apk \;
          fi
          if [ ! -f output/Folerio.apk ]; then
            echo "ERROR: Folerio.apk was not generated!"
            find android -name "*.apk"
            exit 1
          fi
          ls -lh output/Folerio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folerio-Android-APK
          path: output/Folerio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.2
          name: "Folerio Android v1.5.2 (100% Standalone Offline APK, Book Collections & Supabase Auth Fix)"
          body: |
            ### Folerio Standalone Android APK (v1.5.2)
            - **100% Independent Offline APK Loading:** Fixed WebViewClient conflict in MainActivity to fully preserve Capacitor's native asset loader. Folerio now launches completely offline directly from the APK bundle without requiring an active internet connection.
            - **Eliminated 'localhost:3000 refused to connect' Deep-Link Errors:** Secured deep link handlers to prevent WebViews from navigating to localhost:3000, ensuring users stay on the standalone app with seamless OAuth token processing.
            - **New Book Folios & Sequential Chapter Collections:** Added textbook reading directly in Folerio with hierarchical two-tier headers, sequential topic drawers, and bottom book citations (starting with *Genetics: From Genes to Genomes* 7th Ed and *Molecular Biology of the Cell*).
            - **Direct Download:** Download `Folerio.apk` below and tap Install/Update.
          files: output/Folerio.apk
