name: Build Folerio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Prepare Web Assets & Sync to Android
        run: |
          mkdir -p www
          npm run copy-assets
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log || { echo "=== GRADLE FAILURE LOG ==="; tail -n 80 ../gradle-build.log; exit 1; }

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Folerio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folerio-Android-APK
          path: output/Folerio.apk
          retention-days: 30
