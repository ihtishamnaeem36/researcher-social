name: Build Folerio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Android SDK Platform & Accept Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Prepare Web Assets & Sync to Android
        run: |
          mkdir -p www
          npm run copy-assets
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK
        run: |
          cd android
          if ! ./gradlew assembleDebug --stacktrace > ../gradle-build.log 2>&1; then
            ERR=$(grep -A 8 -B 1 "Execution failed for task" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
            if [ -z "$ERR" ]; then
              ERR=$(grep -A 8 "What went wrong" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
            fi
            if [ -z "$ERR" ]; then
              ERR=$(grep -A 5 "Caused by:" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
            fi
            echo "::error title=GradleFailure::$ERR"
            tail -n 60 ../gradle-build.log
            exit 1
          fi

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} output/Folerio.apk \;
          if [ ! -f output/Folerio.apk ]; then
            echo "ERROR: Folerio.apk was not generated!"
            find android -name "*.apk"
            exit 1
          fi
          ls -lh output/Folerio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folerio-Android-APK
          path: output/Folerio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "Folerio Android v1.3.0 (Universal World Disciplines & Impact-Weighted Discovery)"
          body: |
            ### Folerio Standalone Android APK (v1.3.0)
            - **Universal Disciplines of the World (22 Disciplines):** Expanded to encompass the full spectrum of human inquiry: Natural Sciences, Formal Sciences, Engineering & Tech, Medical & Health Sciences, Social Sciences, and Humanities & Arts.
            - **Impact-Weighted Stream Algorithm:** High-velocity, globally famous fields (AI & ML, Biotech, Quantum, Neuroscience, Clinical Medicine, Materials, Economics, Climate, Robotics, Psychology, Astrophysics) appear with higher frequency (~72%), smoothly interleaved with breakthroughs from Pure Math, Philosophy, Archaeology, Law, Linguistics, and Ecology.
            - **1,730+ Breakthrough Research Folios:** Real peer-reviewed landmarks from OpenAlex with 4-slide visual carousels, 4-section book-style expositions, and scholarly peer reviews.
            - **38 Foundational Primers:** Dedicated first-principles masterclasses covering every single discipline in the world.
            - **Explore Global Horizons Matrix:** Multi-faculty filtering tabs (`All Horizons`, `🌟 High-Velocity / Famous`, `🌿 Natural Sciences`, `⚡ Engineering & Tech`, `🩺 Medical & Health`, `🌐 Social Sciences`, `🏛️ Humanities & Arts`, `📐 Formal Sciences`).
            - **Sleek Scholar Authentication & Password Recovery:** Redesigned authentication window with illuminated Folerio crest insignia, smooth segmented tabs, show/hide password toggle, and 1-click password recovery.
            - **Google Sign-In & Supabase Auth:** Official OAuth 2.0 authentication with one-tap Google login, verified email accounts, and live cloud profile sync.
            - **100% Offline-First:** All 1,730 folios and 38 primers are pre-bundled inside the APK. Works completely in Airplane Mode.
            - **Native Photo Gallery Screenshot:** Long-press or click the Share icon to capture clean card cards directly to your phone's Gallery (`Pictures/Folerio`).
            - **Over-The-Air (OTA) Live Sync:** In-app background synchronization automatically checks for and merges newly published research folios without needing to reinstall.
            - **Direct Download:** Download `Folerio.apk` below and tap Install/Update.
          files: output/Folerio.apk
