name: Build Folerio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Android SDK Platform & Accept Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Prepare Web Assets & Sync to Android
        run: |
          mkdir -p www
          npm run copy-assets
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK
        run: |
          cd android
          if ! ./gradlew assembleRelease --stacktrace > ../gradle-build.log 2>&1; then
            if ! ./gradlew assembleDebug --stacktrace >> ../gradle-build.log 2>&1; then
              ERR=$(grep -A 8 -B 1 "Execution failed for task" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              if [ -z "$ERR" ]; then
                ERR=$(grep -A 8 "What went wrong" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              fi
              if [ -z "$ERR" ]; then
                ERR=$(grep -A 5 "Caused by:" ../gradle-build.log | head -n 15 | tr '\n' ' ' | sed 's/"//g')
              fi
              echo "::error title=GradleFailure::$ERR"
              tail -n 60 ../gradle-build.log
              exit 1
            fi
          fi

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -type f -name "*release*.apk" -exec cp -v {} output/Folerio.apk \; || true
          if [ ! -f output/Folerio.apk ]; then
            find android/app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} output/Folerio.apk \;
          fi
          if [ ! -f output/Folerio.apk ]; then
            echo "ERROR: Folerio.apk was not generated!"
            find android -name "*.apk"
            exit 1
          fi
          ls -lh output/Folerio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folerio-Android-APK
          path: output/Folerio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "Folerio Android v1.5.0 (Life Sciences Foundational Curriculum & Universal Disciplines Expansion)"
          body: |
            ### Folerio Standalone Android APK (v1.5.0)
            - **Complete Life Sciences Foundational Curriculum (Modules 3.1 to 3.7):**
              - **3.1 Origin of Life & Abiogenesis:** Primordial Soup (Oparin-Haldane), Miller-Urey 1953 spark simulation, deep-sea hydrothermal vents, panspermia, and the catalytic RNA World hypothesis.
              - **3.1 Evolution of Life:** Darwinian natural selection, Modern Synthesis, transitional paleontology (Archaeopteryx, Tiktaalik), and deep time chronology from Precambrian prokaryotes to Cenozoic hominins.
              - **3.2 Cell Biology & Bioenergetics:** Cell Theory, organellar networks (ER, Golgi, Lysosomes, Mitochondria, Chloroplasts), chemiosmotic oxidative phosphorylation, photosynthesis, and mitosis vs. meiotic recombination.
              - **3.3 Molecular Genetics & Heredity:** Antiparallel Watson-Crick DNA double helix, semiconservative replication, central dogma transcription/translation, Mendelian segregation, Punnett probabilities, monogenic pathologies, and targeted CRISPR-Cas9 endonuclease therapy.
              - **3.4 Microbiology & The Unseen Biosphere:** Bacteria vs. Archaea extremophiles, viral pathogen lifecycles (Influenza, HIV, SARS-CoV-2), gut microbiome metabolic axis, antibiotic resistance mechanisms (MRSA), and industrial fermentation/bioremediation.
              - **3.5 Human Physiology & Homeostasis:** Integrated 8 organ systems, neural action potentials, cardiovascular-respiratory exchange, endocrine axes, and negative/positive feedback control loops.
              - **3.6 Ecology & Earth Systems:** Lindeman's 10% trophic efficiency rule, energy pyramids, food webs, keystone species dynamics (Pisaster sea stars, Yellowstone wolves), and biosphere planetary boundaries.
              - **3.7 Developmental Biology & Stem Cells:** Embryogenesis from zygote to blastocyst and gastrulation, morphogen concentration gradients, totipotent/pluripotent/multipotent hierarchy, and Yamanaka iPSC cellular reprogramming.
            - **Universal Disciplines Expansion (53 Foundational Primers):** Enriched all 22 disciplines with multiple first-principles foundational masterclasses, including Normative Ethics (Philosophy), Separation of Powers (Law), The Neolithic Revolution (History), Bureaucracy & the State (Sociology), Acoustic Phonetics (Linguistics), Conditioning & Plasticity (Psychology), and Engineering Thermodynamics (Aerospace).
            - **Authentic Scholarly Peer Critiques:** Each foundational primer includes interactive academic peer discussions, methodological considerations, and verified DOI citations.
            - **Canonical Auth & Email Redirects:** Supabase confirmation and recovery emails point directly to the public live platform (`https://ihtishamnaeem36.github.io/researcher-social/`).
            - **Folio Save & Share Fixes:** Dynamic slide PNG capture saves directly to Android Gallery (`Pictures/Folerio`) with persistent public canonical links.
            - **Scholar Account & Settings Hub:** Direct topbar and sidebar account controls with live email verification status, password reset dispatch, and offline cache controls.
            - **100% Offline-First:** All 1,730 breakthrough folios and 53 foundational primers are pre-packaged inside the APK. Works completely in Airplane Mode.
            - **Direct Download:** Download `Folerio.apk` below and tap Install/Update.
          files: output/Folerio.apk
